<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Open My Money Book</title><link rel="stylesheet" href="/theme.css"><script src="/__hatchable/auth.js"></script></head><body><div class="app-shell" style="padding-top:12vh"><div class="card" style="padding:28px"><div class="brand" style="margin-bottom:22px"><div class="brand-mark">₦</div><div class="brand-text"><strong>My Money Book</strong><span>Simple money for your market</span></div></div><h1 class="font-display" style="font-size:32px;line-height:1.05;margin:0 0 8px">Keep your money in one place.</h1><p style="color:var(--muted);line-height:1.5;margin:0 0 22px">Use your email. We send you a code. No password to remember.</p><div id="stepEmail"><label class="field"><span style="display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:7px">Your email</span><input id="email" type="email" inputmode="email" autocomplete="username webauthn" placeholder="you@example.com"></label><button class="save" id="sendBtn">Send me a code</button></div><div id="stepCode" hidden><p class="notice" id="sentText">A code was sent to your email.</p><label class="field"><span style="display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:7px">6-digit code</span><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456"></label><button class="save" id="verifyBtn">Open my money book</button></div><p class="error" id="error" hidden></p></div></div><script>
const A=hatchable.auth;const emailEl=document.getElementById('email');const codeEl=document.getElementById('code');const err=document.getElementById('error');const emailStep=document.getElementById('stepEmail');const codeStep=document.getElementById('stepCode');function showError(t){err.textContent=t;err.hidden=!t}A.getSession().then(s=>{if(s?.user)location.href='/'});document.getElementById('sendBtn').onclick=async()=>{showError('');const email=emailEl.value.trim();if(!email){showError('Please enter your email.');return}try{const r=await A.startLogin({email});if(r.has_passkey&&A.supportsPasskeys()){try{const done=await A.signInWithPasskey({email});if(done?.user){location.href='/';return}}catch{}}emailStep.hidden=true;codeStep.hidden=false;codeEl.focus()}catch(e){showError(e.message||'We could not send the code.')}};document.getElementById('verifyBtn').onclick=async()=>{showError('');const code=codeEl.value.trim();if(!/^\d{6}$/.test(code)){showError('Enter the 6-digit code.');return}try{await A.verifyCode({email:emailEl.value.trim(),code});location.href='/'}catch(e){showError(e.message||'That code did not work.')}};
</script></body></html>
